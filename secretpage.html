<!DOCTYPE html>
<html>

<head>
<title>Evidence</title>
<p>Proof of connections between BDR and R.H.</p>
  
<style>
body{
  background:black;
  color:white;
  font-family:Arial;
  text-align:center;
  margin:0;
}

h1{
  margin-top:40px;
}

/* GRID LAYOUT */
.gallery{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap:15px;
  padding:20px;
}

/* IMAGES */
.gallery img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  transition:0.2s;
}

/* HOVER EFFECT */
.gallery img:hover{
  transform:scale(1.05);
}

button{
  padding:12px 20px;
  margin:20px;
  border:none;
  border-radius:8px;
  cursor:pointer;
}
</style>

</head>

<body>

<h1>Photo Gallery</h1>

<div class="gallery">

<img src="photo1.jpg">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">

</div>

<button onclick="location.href='home.html'">Back to Home</button>

</body>

</html>
